# Use this file if the Render service root directory is `backend/`.
# Otherwise set Root Directory to backend and apply the same build/start commands in the dashboard.

services:
  - type: web
    name: ntam-congress-api
    runtime: node
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: '*'
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.8-flash
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: BADGE_SIGNING_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://ntam-congress-api.onrender.com
